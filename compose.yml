services:
  
  db:
    image: postgres:15-alpine
    env_file:
      - ./backend/.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U di-geek -d exchef_db"]
      interval: 10s
      timeout: 5s
      retries: 5



  api:
    build: ./backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - photos_data:/app/photos

    env_file:
      - ./backend/.env

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  photos_data:
      

